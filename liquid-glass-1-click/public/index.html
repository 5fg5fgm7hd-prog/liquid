<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass Activity</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(-45deg, #1e3c72, #2a5298, #00d2ff, #3a7bd5); background-size: 400% 400%; animation: gradient 12s ease infinite; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.6); border-left: 1px solid rgba(255, 255, 255, 0.6); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); padding: 40px; width: 90%; max-width: 600px; text-align: center; }
        .liquid-text { font-family: 'Fredoka One', cursive; font-size: 2.8em; margin-top: 0; background: linear-gradient(to bottom, rgba(255,255,255,1), rgba(255,255,255,0.4)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0px 4px 15px rgba(255, 255, 255, 0.3), 0px -2px 2px rgba(255, 255, 255, 0.5); letter-spacing: 2px; }
        input[type="text"] { width: 100%; padding: 15px; margin: 15px 0; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.15); color: white; font-size: 1.2em; outline: none; backdrop-filter: blur(10px); box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.7); }
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.5); background: linear-gradient(135deg, rgba(255,255,255,0.3), rgba(255,255,255,0.1)); color: white; font-size: 1.2em; font-weight: bold; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); }
        button:hover { background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2)); transform: translateY(-2px); }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .list-container { list-style: none; padding: 0; max-height: 250px; overflow-y: auto; }
        .list-container li { background: rgba(255, 255, 255, 0.1); margin: 10px 0; padding: 15px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); text-align: left; }
        #timer { font-size: 3em; font-weight: bold; margin: 20px 0; }
    </style>
</head>
<body>
<div class="glass-panel">
    <div id="login-screen" class="screen active">
        <h1 class="liquid-text">Join Activity</h1>
        <input type="text" id="group-name" placeholder="Enter Group Name..." autocomplete="off">
        <button id="join-btn">Enter</button>
    </div>
    <div id="input-screen" class="screen">
        <h1 class="liquid-text">Your Answer</h1>
        <input type="text" id="answer-input" placeholder="Type your answer here..." autocomplete="off">
        <button id="submit-answer">Submit</button>
    </div>
    <div id="waiting-screen" class="screen">
        <h1 class="liquid-text">Answers So Far</h1>
        <p>Waiting for the rest of your group...</p>
        <ul id="answers-so-far" class="list-container"></ul>
    </div>
    <div id="voting-screen" class="screen">
        <h1 class="liquid-text">Vote!</h1>
        <p>Select your favorite answer:</p>
        <div id="voting-container"></div>
    </div>
    <div id="results-screen" class="screen">
        <h1 class="liquid-text">Winner!</h1>
        <h2 id="winner-text" style="font-size: 2em; text-shadow: 0 0 10px rgba(255,255,255,0.5);"></h2>
        <p>Next round starting in:</p>
        <div id="timer">10</div>
    </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }
    document.getElementById('join-btn').addEventListener('click', () => {
        const groupName = document.getElementById('group-name').value.trim();
        if (groupName) socket.emit('joinGroup', groupName);
    });
    socket.on('joined', () => showScreen('input-screen'));

    function sendAnswer() {
        const answer = document.getElementById('answer-input').value.trim();
        if (answer) {
            socket.emit('submitAnswer', answer);
            document.getElementById('answer-input').value = '';
            showScreen('waiting-screen');
        }
    }
    document.getElementById('submit-answer').addEventListener('click', sendAnswer);
    document.getElementById('answer-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendAnswer();
    });

    socket.on('answersUpdate', (answers) => {
        const list = document.getElementById('answers-so-far');
        list.innerHTML = '';
        answers.forEach(ans => {
            const li = document.createElement('li');
            li.textContent = ans;
            list.appendChild(li);
        });
    });

    socket.on('startVoting', (answersObj) => {
        showScreen('voting-screen');
        const container = document.getElementById('voting-container');
        container.innerHTML = '';
        for (const [socketId, answer] of Object.entries(answersObj)) {
            const btn = document.createElement('button');
            btn.textContent = answer;
            btn.onclick = () => {
                socket.emit('submitVote', socketId);
                showScreen('waiting-screen');
                document.getElementById('answers-so-far').innerHTML = '<li>Waiting for others to finish voting...</li>';
            };
            container.appendChild(btn);
        }
    });

    let countdownInterval;
    socket.on('showResults', (winnerAnswer) => {
        showScreen('results-screen');
        document.getElementById('winner-text').textContent = winnerAnswer;
        let timeLeft = 10;
        document.getElementById('timer').textContent = timeLeft;
        countdownInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = timeLeft;
            if (timeLeft <= 0) clearInterval(countdownInterval);
        }, 1000);
    });

    socket.on('startNextRound', () => {
        clearInterval(countdownInterval);
        document.getElementById('answers-so-far').innerHTML = '';
        showScreen('input-screen');
    });
</script>
</body>
</html>
